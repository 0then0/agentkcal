name: Bug report
description: Incorrect totals, source parsing, CLI or dashboard problems
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Before reporting, check existing issues and the troubleshooting guide in docs/cli.md. Report security vulnerabilities through SECURITY.md; never attach private agent journals.
  - type: input
    id: version
    attributes:
      label: AgentKcal, Node.js and OS versions
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version, if applicable
      placeholder: Claude Code, Codex, Gemini CLI, Cursor, OpenCode or Cline
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: Include agent version and command. Do not attach raw journals, prompts, credentials or personal paths.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic or redacted usage record
      description: For format problems, include only IDs, timestamps and usage counters. Remove conversation content and identifying metadata.
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual totals or behavior
    validations:
      required: true
