name: Feature or adapter request
description: Suggest a focused capability or agent format
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Check existing issues before requesting a feature. Explain the workflow and expected result; use synthetic examples for agent formats.
  - type: textarea
    id: problem
    attributes:
      label: The use case
      description: Describe the workflow and what's missing.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed behavior and format documentation
      description: Link official schemas where possible. Use synthetic examples without secrets.
